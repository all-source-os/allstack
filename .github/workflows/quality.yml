name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            timeout: timeout
          - os: macos-14
            timeout: gtimeout
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - if: matrix.os == 'macos-14'
        run: brew install coreutils
        timeout-minutes: 2
      - run: ${{ matrix.timeout }} -k 5 120 rustup toolchain install 1.95 --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest@0.9.138
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: ${{ matrix.timeout }} -k 5 270 cargo +1.95 nextest run --locked
      - run: ${{ matrix.timeout }} -k 5 60 cargo +1.95 test --manifest-path fixtures/handoff/Cargo.toml --locked --tests
      - run: ${{ matrix.timeout }} -k 5 60 cargo +1.95 test --manifest-path examples/spendcheck/Cargo.toml --locked --tests
      - if: matrix.os == 'macos-14'
        run: shasum -a256 target/debug/allstack > target/debug/allstack.sha256
      - if: matrix.os == 'macos-14'
        run: git rev-parse HEAD > target/debug/allstack.commit
      - if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: allstack-macos-14
          path: |
            target/debug/allstack
            target/debug/allstack.sha256
            target/debug/allstack.commit
          if-no-files-found: error
          retention-days: 3
  source-and-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: timeout -k 5 120 rustup toolchain install 1.95 --profile minimal --component clippy,rustfmt
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-deny@0.19.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: timeout -k 5 60 cargo +1.95 fmt --all -- --check
      - run: timeout -k 5 60 cargo +1.95 fmt --manifest-path examples/spendcheck/Cargo.toml -- --check
      - run: timeout -k 5 90 cargo +1.95 deny check
      - run: timeout -k 5 270 cargo +1.95 clippy --all-targets --locked -- -D warnings
      - run: timeout -k 5 60 cargo +1.95 clippy --manifest-path examples/spendcheck/Cargo.toml --all-targets --locked -- -D warnings
